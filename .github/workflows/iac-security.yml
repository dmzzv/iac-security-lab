name: IaC Security Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tflint:
    name: TFLint (non-blocking)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show TFLint version
        run: |
          tflint --version
          which tflint

      - name: Initialize TFLint plugins
        run: |
          tflint --init

      - name: Run TFLint (visibility only)
        run: |
          set -o pipefail
          tflint --chdir=terraform | tee tflint-output.txt || true
          if [ ! -s tflint-output.txt ]; then
            echo "TFLint: 0 issue(s) found"
          fi


  checkov_gate:
    name: Checkov Gate (blocking subset)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Runner context
        run: |
          whoami
          hostname
          uname -a

      - name: Checkov policy gate (block only critical checks)
        run: |
          /home/dmzzv/.local/bin/checkov -d terraform/ \
            --config-file .checkov.yml \
            --compact

  checkov_full_scan:
    name: Checkov Full Scan (non-blocking visibility)
    runs-on: [self-hosted, Linux, X64]
    needs: checkov_gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Full scan (do not fail pipeline)
        run: |
          /home/dmzzv/.local/bin/checkov -d terraform/ --compact || true



